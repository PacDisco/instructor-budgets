<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Field Budget</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/DMSerifDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="bar">
  <img class="bar-logo" src="/logo.png" alt="Pacific Discovery" width="314" height="84">
  <div class="bar-id">
    <span class="bar-name" id="budgetName">Loading</span>
    <span class="bar-sub" id="budgetSub"></span>
  </div>
  <button class="chip" id="syncChip" type="button">Checking</button>
</header>

<main id="view"></main>

<section class="signin" id="signin" hidden>
  <img class="signin-logo" src="/logo.png" alt="Pacific Discovery" width="314" height="84">
  <h1>Field Budget</h1>
  <p class="signin-lede">Sign in with your email and the access code your programme director gave you.</p>
  <label for="ciEmail">Email</label>
  <input id="ciEmail" type="email" inputmode="email" autocomplete="username"
         placeholder="you@pacificdiscovery.org">

  <label for="ciCode">Access code</label>
  <input id="ciCode" type="password" autocomplete="current-password"
         placeholder="From your programme director">

  <button class="submit" type="button" id="ciGo">Sign in</button>
  <p class="hint" id="signinMsg"></p>

  <div id="altBlock" hidden>
    <p class="signin-or">or</p>
    <div id="gbtn" class="gbtn"></div>
    <button class="ghost" type="button" id="magicToggle">Email me a link instead</button>
    <div id="magicBlock" hidden>
      <label for="magicEmail">Email a sign-in link</label>
      <input id="magicEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@pacificdiscovery.org">
      <button class="ghost" type="button" id="magicSend">Send link</button>
    </div>
  </div>
</section>

<nav class="dock">
  <button class="dock-btn primary" type="button" data-open="spend">Log spend</button>
  <button class="dock-btn" type="button" data-open="cash">Cash</button>
  <button class="dock-btn" type="button" data-open="history">History</button>
</nav>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-grip"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
